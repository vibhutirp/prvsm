<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrVSM</title>
<style>
  :root {
    --bg: #f4ead8;
    --bg-deep: #ead9bd;
    --surface: #fffdf8;
    --ink: #2a2118;
    --ink-soft: #5b4d3d;
    --muted: #8a7b68;
    --line: #e0d2ba;
    --line-strong: #bfa988;
    --wood: #c89b6a;
    --wood-dark: #a0744a;
    --wood-light: #e3bf92;
    --cork: #d7ae7c;
    --accent: #c4321a;
    --accent-ink: #ffffff;
    --accent-soft: #fde6df;
    --decision: #4353c4;
    --interface: #0b7a75;
    --blocker: #b45309;
    --status: #3f7d20;
    --question: #7e3fa8;
    --grey: #9aa1ab;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); font-family: var(--sans); line-height: 1.45;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 70%, var(--bg-deep) 100%); background-attachment: fixed; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, [contenteditable]:focus-visible, .zone:focus-visible { outline: 3px solid var(--decision); outline-offset: 2px; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 9px 28px; background: var(--surface); border-bottom: 4px solid var(--wood); box-shadow: 0 2px 10px rgba(90, 60, 20, 0.12); }
  .wordmark { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }
  .tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .tab { position: relative; border: 0; background: transparent; color: var(--ink-soft); padding: 8px 13px; border-radius: 999px;
    font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .tab:hover { background: var(--bg); }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  kbd { font-family: var(--mono); font-size: 0.72rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: 0.6; }
  .badge { background: var(--accent); color: var(--accent-ink); font-size: 0.78rem; font-weight: 700; min-width: 22px; height: 22px;
    border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .actions { display: flex; gap: 10px; }
  .btn { border: 1px solid var(--line-strong); border-bottom-width: 3px; background: var(--surface); color: var(--ink); padding: 8px 16px; border-radius: 10px; font-weight: 700; }
  .btn:hover { background: var(--bg); }
  .btn-accent { background: var(--accent); border-color: #96230f; color: var(--accent-ink); }
  .btn-accent:hover { background: #a82a15; }


  /* ---------- One canvas: viewport + world + camera ---------- */
  main.viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
    background: radial-gradient(ellipse at 50% 40%, #fdf6e8 0%, #ecdcbd 100%); }
  main.viewport.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; width: 1060px; height: 745px; transform-origin: 0 0; }
  .world.fly { transition: transform 0.9s cubic-bezier(0.6, 0, 0.2, 1); }
  .world > svg { position: absolute; left: 0; top: 0; width: 1060px; height: 745px; overflow: visible; display: block; font-family: var(--sans); }
  .wb-title { transition: opacity 0.3s; }
  .world[data-view="global"] .wb-title { opacity: 0; }
  .frame { position: absolute; width: 1400px; cursor: zoom-in; }
  .frame.focus { cursor: auto; }
  .frame:not(.focus) * { pointer-events: none; }
  .frame.sign { background: var(--bg); border: 14px solid var(--wood); border-radius: 30px; padding: 22px 30px 30px;
    box-shadow: 0 24px 50px rgba(70, 40, 10, 0.35); }
  .frame.onboard { padding: 4px 16px 10px; }
  .frame.onboard .whiteboard { border: 0; box-shadow: none; padding: 6px 0 0; background: transparent; border-radius: 8px; }
  .frame.onboard .whiteboard::after { display: none; }
  .draft { user-select: text; }

  /* HUD (stays put while the camera moves) */
  .hud-top { position: absolute; left: 16px; right: 16px; top: 10px; z-index: 5; }
  .hq-strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; cursor: default;
    background: linear-gradient(180deg, #b98556, var(--wood-dark)); color: #fff8ea; border-radius: 14px; padding: 7px 14px;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15), 0 6px 16px rgba(70, 40, 10, 0.25); }
  .hq-strip .btn { padding: 4px 12px; font-size: 0.9rem; }
  .hq-title { font-weight: 800; letter-spacing: 0.16em; font-size: 1.05rem; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); flex: 1; }
  .roster { display: flex; gap: 8px; flex-wrap: wrap; }
  .presence { border: 0; background: #fffdf8; color: var(--ink); border-radius: 999px; padding: 3px 12px 3px 9px; font-size: 0.85rem; font-weight: 700;
    display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
  .presence:hover { background: #fff; transform: translateY(-1px); }
  .presence i { width: 10px; height: 10px; border-radius: 50%; background: #35b24a; box-shadow: 0 0 0 2px #d6f3da; display: inline-block; }
  .presence small { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  .scene-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; margin: 0; white-space: nowrap; cursor: default;
    background: rgba(255, 253, 248, 0.92); color: var(--ink-soft); font-weight: 600; font-size: 0.9rem; padding: 5px 18px; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(70, 40, 10, 0.18); }
  .zone { cursor: pointer; outline: none; }
  .zone .hot { transition: filter 0.15s; }
  .zone:hover .hot, .zone:focus-visible .hot { filter: brightness(1.07) saturate(1.15); }
  .zone .ring { opacity: 0; }
  .zone:hover .ring, .zone:focus-visible .ring { opacity: 1; }
  .avatar { pointer-events: none; }
  .avatar .paper { display: none; }
  .avatar.carrying .paper { display: block; }
  @keyframes step { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  .avatar.walking .av-body { animation: step 0.18s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .bob { animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes pop { 0% { transform: scale(0.2); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .pop { animation: pop 0.5s ease-out 1; transform-box: fill-box; transform-origin: 50% 100%; }

  /* ---------- Flat views: boards pinned on the wall ---------- */
  .view-head { display: flex; align-items: baseline; gap: 16px; margin: 0 0 14px; flex-wrap: wrap; }
  .view-head h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  .view-head p { margin: 0; color: var(--ink-soft); }
  .cols { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .cols.wide { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  .cork .grid { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
  h2 { display: inline-block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: #fff8ea; margin: 0 0 12px;
    background: var(--wood-dark); padding: 3px 12px; border-radius: 6px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
  section + section { margin-top: 26px; }
  .stack { display: grid; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; }
  .empty { border: 2px dashed rgba(90, 60, 20, 0.35); border-radius: 8px; padding: 18px; color: var(--ink-soft); background: rgba(255, 253, 248, 0.55); font-weight: 600; }

  .cork { border: 12px solid var(--wood); border-radius: 10px; padding: 22px 18px 18px;
    background-color: var(--cork);
    background-image: radial-gradient(rgba(120, 78, 36, 0.28) 1px, transparent 1.4px), radial-gradient(rgba(255, 240, 210, 0.35) 1px, transparent 1.4px);
    background-size: 13px 13px, 17px 17px; background-position: 0 0, 6px 9px;
    box-shadow: inset 0 3px 10px rgba(70, 40, 10, 0.35), 0 8px 18px rgba(90, 60, 20, 0.2); }
  .whiteboard { border: 10px solid #cdd2d6; border-bottom-width: 22px; border-radius: 12px; padding: 22px 18px 18px; background: #fcfdfd;
    box-shadow: inset 0 2px 8px rgba(40, 60, 80, 0.12), 0 8px 18px rgba(90, 60, 20, 0.2); position: relative; }
  .whiteboard::after { content: ""; position: absolute; left: 30px; bottom: -17px; width: 120px; height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, var(--accent) 0 30%, transparent 30% 36%, var(--decision) 36% 66%, transparent 66% 72%, var(--status) 72%); }
  .inbox { border: 10px solid var(--wood-dark); border-top-width: 5px; border-radius: 8px 8px 14px 14px; padding: 20px 16px 16px; background: var(--wood-light);
    box-shadow: inset 0 6px 12px rgba(70, 40, 10, 0.3), 0 8px 18px rgba(90, 60, 20, 0.2); }

  /* Artifact card = pinned paper */
  .card { --hue: var(--grey); position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 7px solid var(--hue);
    border-radius: 4px 8px 8px 4px; padding: 17px 16px 12px; box-shadow: 0 1px 0 rgba(90, 60, 20, 0.12), 0 6px 12px rgba(70, 40, 10, 0.2); }
  .card::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -8px; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 12%, var(--hue) 40%); box-shadow: 0 3px 3px rgba(40, 20, 0, 0.35); }
  .card[data-type="decision"] { --hue: var(--decision); }
  .card[data-type="interface"] { --hue: var(--interface); }
  .card[data-type="blocker"] { --hue: var(--blocker); }
  .card[data-type="status"] { --hue: var(--status); }
  .card[data-type="question"] { --hue: var(--question); }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .type-tag { background: var(--hue); color: #fff; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 2px 8px; border-radius: 4px; }
  .id-chip { font-family: var(--mono); font-size: 0.8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; color: var(--ink); }
  .pill { margin-left: auto; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .card h3 { margin: 0 0 3px; font-size: 1.05rem; line-height: 1.3; }
  .card .text { margin: 0 0 9px; color: var(--ink-soft); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); }
  .meta b { color: var(--ink-soft); font-weight: 600; }
  .source { margin-top: 6px; font-size: 0.82rem; color: var(--muted); }
  .link { border: 0; background: none; padding: 0; color: var(--decision); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; font-weight: 600; }
  .link:hover { color: var(--ink); }
  .lineage { margin-top: 6px; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); }
  .lineage .link { font-family: var(--mono); }
  .card.superseded { --hue: var(--grey) !important; background: #efebe3; color: var(--muted); box-shadow: 0 2px 5px rgba(70, 40, 10, 0.12); }
  .card.superseded h3 { text-decoration: line-through; color: var(--muted); }
  .card.superseded .text { color: var(--muted); }
  .card.superseded .type-tag { background: var(--grey); }
  .card.proposed { border: 2px dashed var(--line-strong); border-left: 7px solid var(--hue); background: #fffbee; box-shadow: none; }
  .card.proposed::before { display: none; }
  .card.proposed .pill { color: var(--accent); }

  /* Proposal */
  .proposal { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; max-width: 840px;
    box-shadow: 0 6px 12px rgba(70, 40, 10, 0.22); }
  .diff { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); }
  .diff-row { display: grid; grid-template-columns: 3.2em 1fr; gap: 8px; font-family: var(--mono); font-size: 0.85rem; padding: 3px 0; }
  .diff-row .lbl { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding-top: 3px; }
  .diff-old { color: var(--muted); text-decoration: line-through; }
  .diff-new { color: var(--ink); font-weight: 700; background: #dcf0e2; border-radius: 4px; padding: 1px 5px; }
  .diff-note { margin: 9px 0 0; font-size: 0.95rem; color: var(--ink); }
  .proposal-actions { display: flex; gap: 10px; }

  /* Draft = paper on a clipboard */
  .panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 26px 18px 18px;
    box-shadow: 0 0 0 9px var(--wood), 0 12px 20px rgba(70, 40, 10, 0.25); margin: 9px; }
  .panel.clip::before { content: ""; position: absolute; top: -20px; left: 50%; margin-left: -50px; width: 100px; height: 26px; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #d5d9dd, #9ea5ac); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3); }
  .panel h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .panel .hint { margin: 0 0 12px; font-size: 0.85rem; color: var(--muted); }
  .draft { font-family: var(--mono); font-size: 0.95rem; background: #fbf6ea; border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 14px; min-height: 4.5em; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
  .note { margin: 10px 0 0; font-size: 0.85rem; color: var(--ink-soft); }

  /* Alerts = red sticky notes */
  .alert { background: var(--accent-soft); border: 1px solid #ecc1b7; border-left: 7px solid var(--accent); border-radius: 4px 8px 8px 4px; padding: 13px 16px;
    box-shadow: 0 6px 12px rgba(70, 40, 10, 0.2); }
  .alert .ids { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; }
  .alert p { margin: 4px 0 8px; }
  .alert.resolved { background: #eef4e8; border-color: #cfdcc4; border-left-color: var(--status); }
  .alert.resolved p { color: var(--ink-soft); }
  .resolved-tag { margin-left: 10px; font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; background: var(--status); border-radius: 4px; padding: 2px 8px; }

  /* Toast */
  .toasts { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; pointer-events: none; }
  .toast { background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 20px rgba(42, 33, 24, 0.3); }

  /* Highlight pulse */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(196, 50, 26, 0.6); }
    35% { box-shadow: 0 0 0 9px rgba(196, 50, 26, 0.35); }
    100% { box-shadow: 0 0 0 0 rgba(196, 50, 26, 0); }
  }
  .pulse { animation: pulse 1.5s ease-out 1; }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; outline: 3px solid var(--accent); outline-offset: 2px; }
    .bob, .pop, .avatar.walking .av-body { animation: none; }
    .world.fly { transition: none; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wordmark">Pr<span>VSM</span></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-action="view" data-view="home">Office <kbd>0</kbd></button>
    <button class="tab" role="tab" data-action="view" data-view="electrical">Team Electrical <kbd>1</kbd></button>
    <button class="tab" role="tab" data-action="view" data-view="mechanical">Team Mechanical <span class="badge" id="fe-badge" hidden></span> <kbd>2</kbd></button>
    <button class="tab" role="tab" data-action="view" data-view="global">Global <kbd>3</kbd></button>
  </nav>
  <div class="actions">
    <button class="btn btn-accent" data-action="sync">Sync</button>
    <button class="btn" data-action="reset">Reset</button>
  </div>
</header>
<main id="app" class="viewport">
  <div class="world" id="world"></div>
  <div class="hud-top"><div class="hq-strip">
    <button class="btn" id="hud-back" data-action="view" data-view="home" hidden>← Back to office <kbd>0</kbd></button>
    <div class="hq-title">PRVSM HEADQUARTERS</div>
    <div class="roster">
      <button class="presence" data-action="view" data-view="electrical"><i></i>Priya <small>· Electrical</small></button>
      <button class="presence" data-action="view" data-view="mechanical"><i></i>Sam <small>· Mechanical</small></button>
      <button class="presence" data-action="view" data-view="global"><i></i>Translator</button>
    </div>
  </div></div>
  <p class="scene-hint" id="hint">Click a cubicle or the whiteboard to fly in · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> · scroll to zoom, drag to pan, <kbd>0</kbd> to come back</p>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* ===================== Pure state logic (no DOM) ===================== */
var SEED_TEXT = 'Pack is 300 × 120 × 90 mm, 48 V; frame mounts on the long axis.';
var EDIT_TEXT = 'Pack is 340 × 120 × 90 mm, 48 V; frame mounts on the long axis.';
var EDIT_DIFF = 'Pack grows 40 mm on the long axis for more range; voltage unchanged. Mechanical must recheck frame fit — current frame won’t fit the new pack.';
var SRC_DEC_BE_002 = { label: 'Team Electrical board · DEC-EL-002', view: 'electrical', el: 'card-DEC-EL-002' };

function artifact(id, type, team, affects, updated, state, source, title, text) {
  return { id: id, type: type, team: team, affects: affects, updated: updated, state: state,
    source: source, body: { title: title, text: text } };
}

function seedState() {
  return {
    view: 'electrical',
    draft: SEED_TEXT,
    imported: false,
    whiteboard: [
      artifact('INT-EL-001', 'interface', 'electrical', ['mechanical'], '2026-09-18T10:05:00Z', 'accepted', SRC_DEC_BE_002,
        'Battery pack envelope', SEED_TEXT),
      artifact('DEC-EL-001', 'decision', 'electrical', ['mechanical', 'firmware'], '2026-09-18T10:05:00Z', 'accepted', SRC_DEC_BE_002,
        '48 V bus everywhere', 'Every powertrain component runs on the 48 V bus; no secondary high-voltage rails.')
    ],
    boards: {
      electrical: [
        artifact('DEC-EL-002', 'decision', 'electrical', [], '2026-09-18T09:40:00Z', 'accepted', { label: "chat: Priya's Claude chat, Sep 18" },
          'Electrical owns the battery pack spec', 'Cells, pack dimensions and voltage are set by Electrical; other teams design to the published envelope.'),
        artifact('STA-EL-001', 'status', 'electrical', [], '2026-09-18T16:20:00Z', 'accepted', SRC_DEC_BE_002,
          'Pack v1 prototype on the bench', '300 mm pack assembled and cycling on the bench; thermal test still pending.')
      ],
      mechanical: [
        artifact('STA-ME-001', 'status', 'mechanical', [], '2026-09-17T15:10:00Z', 'accepted', { label: "chat: Sam's Claude chat, Sep 17" },
          'Frame CAD v1 complete', 'Frame modelled around the current pack; prototype weld-up is next.')
      ]
    },
    proposals: [],
    alerts: []
  };
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function norm(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }
function findById(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

/* Current accepted head of the battery pack interface lineage (INT-EL-001 → …). */
function headInterface(state) {
  var a = findById(state.whiteboard, 'INT-EL-001');
  while (a && a.supersededBy && findById(state.whiteboard, a.supersededBy)) a = findById(state.whiteboard, a.supersededBy);
  return a;
}

function setView(state, view) { var s = clone(state); s.view = view; return { state: s, fresh: [] }; }
function setDraft(state, text) { var s = clone(state); s.draft = text; return { state: s, fresh: [] }; }

function sync(state, now) {
  var s = clone(state);
  s.view = 'global';
  var head = headInterface(s);
  var draft = norm(s.draft);
  var pending = s.proposals.some(function (p) { return p.supersedes === head.id; });
  if (!draft || draft === norm(head.body.text) || pending) {
    return { state: s, toast: 'Nothing new to translate.', fresh: [] };
  }
  var n = parseInt(head.id.slice(-3), 10) + 1;
  var id = 'INT-EL-' + ('00' + n).slice(-3);
  var p = artifact(id, 'interface', 'electrical', ['mechanical'], now, 'proposed',
    { label: 'Team Electrical board · Battery pack draft', view: 'electrical', el: 'draft-panel' },
    'Battery pack envelope (v' + n + ')', draft);
  p.supersedes = head.id;
  p.diff = (draft === EDIT_TEXT && norm(head.body.text) === SEED_TEXT)
    ? EDIT_DIFF
    : "Pack envelope changed from '" + norm(head.body.text) + "' to '" + draft + "'.";
  s.proposals.push(p);
  return { state: s, toast: 'Proposed ' + id + ' — review it in the tray.', fresh: ['card-' + id] };
}

function accept(state, id, now) {
  var s = clone(state);
  var p = findById(s.proposals, id);
  if (!p) return { state: s, fresh: [] };
  s.proposals = s.proposals.filter(function (x) { return x.id !== id; });
  p.state = 'accepted';
  p.updated = now;
  var old = findById(s.whiteboard, p.supersedes);
  var at = s.whiteboard.length;
  if (old) {

    if (a.supersedes) lineage += '<div class="lineage">supersedes ' + gotoLink(a.supersedes, 'global', 'card-' + a.supersedes) + '</div>';
    var source = a.source.view ? gotoLink(a.source.label, a.source.view, a.source.el) : esc(a.source.label);
    var pill = a.state === 'proposed' ? 'proposed · pending review' : a.state;
    return '<article class="card ' + a.state + '" id="card-' + a.id + '" data-type="' + a.type + '">' +
      '<div class="card-top"><span class="type-tag">' + a.type + '</span><span class="id-chip">' + a.id + '</span>' +
      '<span class="pill">' + pill + '</span></div>' +
      '<h3>' + esc(a.body.title) + '</h3>' +
      '<p class="text">' + esc(a.body.text) + '</p>' +
      lineage +
      '<div class="meta"><span><b>team</b> ' + a.team + '</span>' +
      '<span><b>affects</b> ' + (a.affects.length ? a.affects.join(', ') : '—') + '</span>' +
      '<span title="' + esc(a.updated) + '"><b>updated</b> ' + a.updated.slice(0, 10) + '</span>' +
      '<span><b>state</b> ' + a.state + '</span></div>' +
      '<div class="source">source: ' + source + '</div>' +
      '</article>';
  }

  function proposalHTML(p) {
    var old = findById(state.whiteboard, p.supersedes);
    return '<div class="proposal">' + cardHTML(p) +
      '<div class="diff">' +
      '<div class="diff-row"><span class="lbl">Old</span><span><span class="diff-old">' + esc(old ? old.body.text : '') + '</span></span></div>' +
      '<div class="diff-row"><span class="lbl">New</span><span><span class="diff-new">' + esc(p.body.text) + '</span></span></div>' +
      '<p class="diff-note">' + esc(p.diff) + '</p></div>' +
      '<div class="proposal-actions">' +
      '<button class="btn btn-accent" data-action="accept" data-id="' + p.id + '">Accept</button>' +
      '<button class="btn" data-action="dismiss" data-id="' + p.id + '">Dismiss</button></div></div>';
  }

  function alertHTML(al) {
    return '<div class="alert' + (al.resolvedBy ? ' resolved' : '') + '" id="' + al.id + '"><div class="ids">' + esc(al.from) + ' → ' + esc(al.to) +
      (al.resolvedBy ? '<span class="resolved-tag">✓ Resolved</span>' : '') + '</div>' +
      '<p>' + esc(al.text) + '</p>' + gotoLink('View on whiteboard', al.link.view, al.link.el) +
      (al.resolvedBy ? '<div class="lineage">resolved by ' + gotoLink(al.resolvedBy, 'mechanical', 'card-' + al.resolvedBy) + '</div>' : '') + '</div>';
  }

  function headHTML(title, sub) { return '<div class="view-head"><h1>' + title + '</h1><p>' + sub + '</p></div>'; }

  function frameHTML(view, inner) {
    var f = FRAMES[view], k = f.w / FRAME_W;
    var pos = 'left:' + (f.ax - FRAME_W / 2).toFixed(1) + 'px;' +
      (f.anchor === 'bottom' ? 'bottom:' + (VB.h - f.ay).toFixed(1) + 'px;transform-origin:50% 100%;' : 'top:' + f.ay.toFixed(1) + 'px;transform-origin:50% 0;');
    return '<div class="frame ' + f.cls + '" id="frame-' + view + '" data-frame="' + view + '" style="' + pos + 'transform:scale(' + k + ')">' + inner + '</div>';
  }

  function boardsHTML() {
    var electrical = headHTML('Team Electrical', 'The team\'s own board and working drafts.') +
      '<div class="cols"><section><h2>Team board</h2><div class="cork"><div class="grid">' + state.boards.electrical.map(cardHTML).join('') + '</div></div></section>' +
      '<section><h2>Working draft</h2><div class="panel clip" id="draft-panel"><h3>Battery pack draft</h3>' +
      '<p class="hint">Click the text to edit.</p>' +
      '<div class="draft" id="draft" contenteditable="true" spellcheck="false" role="textbox" aria-label="Battery pack draft"></div>' +
      '<button class="btn" data-action="scripted-edit">Swap in bigger battery</button></div></section></div>';
    var mechanical = headHTML('Team Mechanical', 'The team\'s own board and incoming alerts.') +
      '<div class="cols"><section><h2>Team board</h2><div class="cork"><div class="grid">' + state.boards.mechanical.map(cardHTML).join('') + '</div></div></section>' +
      '<div><section><h2>Alerts</h2><div class="stack">' +
      (state.alerts.length ? state.alerts.map(alertHTML).join('') : '<div class="empty">No alerts.</div>') + '</div></section>' +
      '<section><h2>Import</h2><div class="panel"><button class="btn" data-action="import">Import Claude export — Sam\'s chat</button>' +
      (state.imported ? '<p class="note">Distilled artifacts only — raw transcripts are never stored.</p>' : '') +
      '</div></section></div></div>';
    var global = '<div class="cols wide"><section><h2>Main whiteboard</h2><div class="whiteboard" id="wb-frame"><div class="grid">' + state.whiteboard.map(cardHTML).join('') + '</div></div></section>' +
      '<section><h2>Proposal tray</h2><div class="inbox"><div class="stack">' +
      (state.proposals.length ? state.proposals.map(proposalHTML).join('') : '<div class="empty">No proposals. Sync to check for changes.</div>') +
      '</div></div></section></div>';
    return frameHTML('electrical', electrical) + frameHTML('mechanical', mechanical) + frameHTML('global', global);
  }

  /* Tabs, badge, HUD, which board is "in focus" — no world rebuild needed */
  function syncChrome() {
    var v = state.view;
    if (v === 'mechanical') {                       /* looking at the alerts clears Sam's bubble */
      seenAlerts = state.alerts.length;
      var bub = document.getElementById('sam-bubble');
      if (bub && bub.parentNode) bub.parentNode.removeChild(bub);
    }
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-selected', String(tabs[i].getAttribute('data-view') === v));
    var badge = document.getElementById('fe-badge');
    var openAlerts = state.alerts.filter(function (al) { return !al.resolvedBy; }).length;
    badge.hidden = openAlerts === 0;
    badge.textContent = openAlerts;
    badge.setAttribute('aria-label', openAlerts + ' open alerts');
    world.setAttribute('data-view', v);
    document.getElementById('hud-back').hidden = v === 'home';
    document.getElementById('hint').hidden = v !== 'home';
    var frames = document.querySelectorAll('.frame');
    for (var j = 0; j < frames.length; j++) frames[j].classList.toggle('focus', frames[j].getAttribute('data-frame') === v);
  }

  function render() {
    if (state.view === 'mechanical') seenAlerts = state.alerts.length;
    world.innerHTML = sceneSVG() + boardsHTML();
    document.getElementById('draft').textContent = state.draft;
    syncChrome();
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    toasts.innerHTML = '';
    toasts.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
  }

  function pulse(ids) {
    (ids || []).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      setTimeout(function () { el.classList.remove('pulse'); }, 1700);
    });
  }

  /* ---------- Camera ---------- */
  var cam = { x: 0, y: 0, s: 1 };

  function shotFor(view) {
    if (view === 'home') return HOME_SHOT;
    var f = FRAMES[view], k = f.w / FRAME_W, el = document.getElementById('frame-' + view);
    var h = el.offsetHeight * k;
    return { x: f.ax - f.w / 2, y: f.anchor === 'bottom' ? f.ay - h : f.ay, w: f.w, h: h, maxS: 1.15 / k, k: k };
  }
  function fit(r) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight, room = vh - HUD_TOP - 12;
    var s = Math.min(vw * 0.95 / r.w, room * 0.97 / r.h, r.maxS);
    if (r.k) s = Math.max(s, Math.min(vw * 0.95 / r.w, 0.85 / r.k));   /* boards never land smaller than readable; drag to see the rest */
    var slack = room - r.h * s;
    return { s: s, x: (vw - r.w * s) / 2 - r.x * s, y: HUD_TOP + (slack < 0 ? 6 : slack * (r.k ? 0.3 : 0.5)) - r.y * s };
  }
  function setCam(c, animate) {
    world.classList.toggle('fly', !!animate && !reducedMotion());
    void world.offsetWidth;
    cam = c;
    world.style.transform = 'translate(' + c.x.toFixed(2) + 'px,' + c.y.toFixed(2) + 'px) scale(' + c.s.toFixed(4) + ')';
  }
  function camMoves(c) { return Math.abs(c.s / cam.s - 1) > 0.01 || Math.abs(c.x - cam.x) > 4 || Math.abs(c.y - cam.y) > 4; }
  function flyTo(view, animate) { setCam(fit(shotFor(view)), animate); }

  /* Free roaming: keep the viewport centre inside the office, and work out which board (if any) is in focus */
  function roam(c) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    c.x = Math.max(vw / 2 - VB.w * c.s, Math.min(vw / 2, c.x));
    c.y = Math.max(vh / 2 - VB.h * c.s, Math.min(vh / 2, c.y));
    setCam(c, false);
    var cx = (vw / 2 - c.x) / c.s, cy = (vh / 2 - c.y) / c.s, found = 'home';
    ['electrical', 'mechanical', 'global'].forEach(function (v) {
      var r = shotFor(v);
      if (c.s * r.k >= 0.5 && cx > r.x - 8 && cx < r.x + r.w + 8 && cy > r.y - 8 && cy < r.y + r.h + 8) found = v;
    });
    if (found !== state.view) { state = setView(state, found).state; syncChrome(); }
  }

  function apply(result) {
    var prev = state.view;
    state = result.state;
    render();
    var target = fit(shotFor(state.view)), flying = camMoves(target) && !reducedMotion();
    setCam(target, true);
    if (result.toast) toast(result.toast);
    if (flying && state.view !== prev) setTimeout(function () { pulse(result.fresh); }, 920);
    else pulse(result.fresh);
  }

  function go(view) {
    if (busy) return;
    if (view === state.view) flyTo(view, true);      /* re-centre after roaming */
    else apply(setView(state, view));
  }

  /* ---------- Moment: Sync — the Translator carries a paper to the tray ---------- */
  function runSync() {
    var result = sync(state, new Date().toISOString());
    if (!result.fresh.length || reducedMotion()) { apply(result); return; }
    busy = true;
    var wasHome = state.view === 'home';
    if (!wasHome) { state = setView(state, 'home').state; render(); }
    var shot = fit(wasHome ? HOME_SHOT : WALK_SHOT), wait = camMoves(shot) ? 950 : 30;
    setCam(shot, true);
    setTimeout(function () {
      var tr = document.getElementById('av-translator');
      void tr.getBoundingClientRect();
      tr.classList.add('walking');
      tr.style.transition = 'transform 0.5s ease-in-out';
      tr.style.transform = translate(POS.translatorElectrical);
      setTimeout(function () {
        tr.classList.add('carrying');
        tr.style.transition = 'transform 1.4s ease-in-out';
        tr.style.transform = translate(POS.translatorIdle);
        setTimeout(function () {
          state = setView(result.state, 'home').state;
          popTray = true; render(); popTray = false;
          setTimeout(function () { busy = false; apply(result); }, 700);
        }, 1450);
      }, 550);
    }, wait);
  }

  /* ---------- Input ---------- */
  document.addEventListener('click', function (e) {
    if (busy || suppressClick || !e.target.closest) return;
    var frame = e.target.closest('.frame');
    if (frame && frame.getAttribute('data-frame') !== state.view) { go(frame.getAttribute('data-frame')); return; }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var now = new Date().toISOString();
    if (action === 'view') go(el.getAttribute('data-view'));
    else if (action === 'sync') runSync();
    else if (action === 'reset') { seenAlerts = 0; apply({ state: setView(seedState(), 'home').state, toast: 'Reset to seed state.', fresh: [] }); }
    else if (action === 'scripted-edit') { var r = setDraft(state, EDIT_TEXT); r.fresh = ['draft']; apply(r); }
    else if (action === 'accept') { var ra = accept(state, el.getAttribute('data-id'), now); ra.fresh = ra.fresh.concat(['wb-frame']); apply(ra); }
    else if (action === 'dismiss') apply(dismiss(state, el.getAttribute('data-id')));
    else if (action === 'import') apply(importChat(state));
    else if (action === 'goto') {
      var r2 = setView(state, el.getAttribute('data-view'));
      r2.fresh = [el.getAttribute('data-el')];
      apply(r2);
    }
  });

  /* Manual draft edits: update state without re-rendering (keeps the caret). */
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'draft') state = setDraft(state, e.target.textContent).state;
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.id === 'draft') { if (e.key === 'Enter') { e.preventDefault(); t.blur(); } return; }
    if (busy || e.ctrlKey || e.metaKey || e.altKey || (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))) return;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('zone')) {
      e.preventDefault(); go(t.getAttribute('data-view')); return;
    }
    var views = { '0': 'home', '1': 'electrical', '2': 'mechanical', '3': 'global' };
    if (views[e.key]) go(views[e.key]);
  });

  /* Scroll = zoom around the cursor */
  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (busy) return;
    var box = viewport.getBoundingClientRect(), mx = e.clientX - box.left, my = e.clientY - box.top;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    var s = Math.max(fit(HOME_SHOT).s * 0.7, Math.min(13, cam.s * Math.exp(-dy * 0.0016))), f = s / cam.s;
    roam({ s: s, x: mx - (mx - cam.x) * f, y: my - (my - cam.y) * f });
  }, { passive: false });

  /* Drag = pan (a click without movement still counts as a click) */
  var drag = null;
  viewport.addEventListener('pointerdown', function (e) {
    if (busy || e.button !== 0 || !e.target.closest) return;
    if (e.target.closest('.hud-top, .frame.focus button, .frame.focus [contenteditable]')) return;
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 7) return;
      drag.moved = true;
      viewport.classList.add('dragging');
      try { viewport.setPointerCapture(drag.id); } catch (err) {}
    }
    roam({ s: cam.s, x: drag.cx + dx, y: drag.cy + dy });
  });
  function endDrag() {
    if (drag && drag.moved) { suppressClick = true; setTimeout(function () { suppressClick = false; }, 60); }
    drag = null;
    viewport.classList.remove('dragging');
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', function () { if (!busy) flyTo(state.view, false); });

  render();
  flyTo('home', false);
})();
</script>
</body>
</html>
