<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrVSM</title>
<style>
  :root {
    --bg: #F5F6FA;
    --surface: #FFFFFF;
    --ink: #1B1F3B;
    --ink-soft: #5A607F;
    --line: #E6E8F0;
    --line-strong: #D5D9E6;
    --purple: #6C5CE7;
    --purple-dark: #5A4BD6;
    --purple-wash: #F3F1FE;
    --teal: #1BC0C0;
    --coral: #FF6B6B;
    --coral-text: #D94545;
    --amber: #F5A623;
    --amber-wash: #FEF1DC;
    --grey: #B8BCCB;
    --shadow: 0 2px 8px rgba(27, 31, 59, 0.08);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: Georgia, "Times New Roman", ui-serif, serif;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); font-family: var(--sans); line-height: 1.45; background: var(--bg); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, [contenteditable]:focus-visible, .zone:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }

  /* Top bar */
  .topbar { position: relative; z-index: 10; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 10px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .wordmark { font-family: var(--serif); font-weight: 700; font-size: 1.45rem; color: var(--ink); }
  .wordmark span { color: var(--purple); }
  .tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .tab { position: relative; border: 0; background: transparent; color: var(--ink-soft); padding: 8px 14px; border-radius: 10px;
    font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .tab:hover { background: var(--bg); color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--purple); color: #fff; }
  kbd { font-family: var(--mono); font-size: 0.72rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: 0.65; }
  .badge { background: var(--coral); color: var(--ink); font-size: 0.78rem; font-weight: 800; min-width: 22px; height: 22px;
    border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .actions { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 9px 18px; border-radius: 10px; font-weight: 700; }
  .btn:hover { background: var(--bg); border-color: var(--grey); }
  .btn-accent { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 2px 8px rgba(108, 92, 231, 0.3); }
  .btn-accent:hover { background: var(--purple-dark); border-color: var(--purple-dark); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--bg); border-color: var(--line); color: var(--ink); }

  /* ---------- One canvas: viewport + world + camera ---------- */
  main.viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; background: var(--bg); }
  main.viewport.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; width: 1060px; height: 745px; transform-origin: 0 0; }
  .world.fly { transition: transform 0.9s cubic-bezier(0.6, 0, 0.2, 1); }
  .world > svg { position: absolute; left: 0; top: 0; width: 1060px; height: 745px; overflow: visible; display: block; font-family: var(--sans); }
  .floor-label { font-family: var(--serif); }
  .wb-title { transition: opacity 0.3s; }
  .world[data-view="global"] .wb-title { opacity: 0; }
  .frame { position: absolute; width: 1400px; cursor: zoom-in; }
  .frame.focus { cursor: auto; }
  .frame:not(.focus) * { pointer-events: none; }
  .frame.sign { --zone: var(--purple); background: var(--surface); border: 8px solid var(--line-strong); border-top: 16px solid var(--zone); border-radius: 24px;
    padding: 22px 30px 30px; box-shadow: 0 16px 40px rgba(27, 31, 59, 0.18); }
  #frame-frontend { --zone: var(--teal); }
  .frame.onboard { padding: 4px 16px 10px; }
  .draft { user-select: text; }

  /* HUD (stays put while the camera moves) */
  .hud-top { position: absolute; left: 16px; right: 16px; top: 10px; z-index: 5; }
  .hq-strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; cursor: default;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 7px 14px; box-shadow: var(--shadow); }
  .hq-strip .btn { padding: 4px 12px; font-size: 0.9rem; }
  .hq-title { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; flex: 1; }
  .roster { display: flex; gap: 8px; flex-wrap: wrap; }
  .presence { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 12px 3px 9px; font-size: 0.85rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px; }
  .presence:hover { border-color: var(--grey); background: var(--bg); }
  .presence i { width: 9px; height: 9px; border-radius: 50%; background: #2DBE60; display: inline-block; }
  .presence small { color: var(--ink-soft); font-weight: 500; font-size: 0.8rem; }
  .scene-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; margin: 0; white-space: nowrap; cursor: default;
    background: var(--surface); color: var(--ink-soft); font-weight: 500; font-size: 0.9rem; padding: 5px 18px; border-radius: 999px;
    border: 1px solid var(--line); box-shadow: var(--shadow); }
  .zone { cursor: pointer; outline: none; }
  .zone .hot { transition: filter 0.15s; }
  .zone:hover .hot, .zone:focus-visible .hot { filter: saturate(2.2); }
  .zone .ring { opacity: 0; }
  .zone:hover .ring, .zone:focus-visible .ring { opacity: 1; }
  .avatar { pointer-events: none; }
  .avatar .paper { display: none; }
  .avatar.carrying .paper { display: block; }
  @keyframes step { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  .avatar.walking .av-body { animation: step 0.18s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .bob { animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes pop { 0% { transform: scale(0.2); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .pop { animation: pop 0.5s ease-out 1; transform-box: fill-box; transform-origin: 50% 100%; }

  /* ---------- Boards ---------- */
  .view-head { display: flex; align-items: baseline; gap: 16px; margin: 0 0 14px; flex-wrap: wrap; }
  .view-head h1 { margin: 0; font-family: var(--serif); font-size: 1.6rem; font-weight: 700; }
  .view-head p { margin: 0; color: var(--ink-soft); }
  .cols { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .cols.wide { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  .cork .grid { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
  h2 { font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; }
  section + section { margin-top: 24px; }
  .stack { display: grid; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 14px; }
  .empty { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 18px; color: var(--ink-soft); background: var(--surface); font-weight: 500; }
  .cork, .whiteboard, .inbox { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  /* Artifact card */
  .card { --hue: var(--grey); --hue-wash: #ECEDF2; position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--hue);
    border-radius: 12px; padding: 14px 16px 12px; box-shadow: var(--shadow); }
  .card[data-type="decision"] { --hue: #6C5CE7; --hue-wash: #ECEAFC; }
  .card[data-type="interface"] { --hue: #1BC0C0; --hue-wash: #DCF5F5; }
  .card[data-type="blocker"] { --hue: #FF6B6B; --hue-wash: #FFE7E7; }
  .card[data-type="status"] { --hue: #5A607F; --hue-wash: #E9EAF1; }
  .card[data-type="question"] { --hue: #F5A623; --hue-wash: #FEF1DC; }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .type-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--hue-wash); color: var(--ink); font-size: 0.75rem; font-weight: 700; padding: 2px 9px; border-radius: 6px; }
  .type-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hue); }
  .type-tag::first-letter, .pill::first-letter { text-transform: uppercase; }
  .type-tag { text-transform: capitalize; }
  .id-chip { font-family: var(--mono); font-size: 0.8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: var(--ink); }
  .pill { display: inline-block; margin-left: auto; font-size: 0.75rem; font-weight: 600; color: var(--ink-soft); }
  .card h3 { margin: 0 0 3px; font-family: var(--serif); font-size: 1.12rem; font-weight: 700; line-height: 1.3; }
  .card .text { margin: 0 0 9px; color: var(--ink-soft); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--ink-soft); }
  .meta b { color: var(--ink); font-weight: 600; }
  .source { margin-top: 6px; font-size: 0.82rem; color: var(--ink-soft); }
  .link { border: 0; background: none; padding: 0; color: var(--purple); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; font-weight: 600; }
  .link:hover { color: var(--ink); }
  .lineage { margin-top: 6px; font-size: 0.85rem; font-weight: 600; color: var(--ink); }
  .lineage .link { font-family: var(--mono); }
  .card.superseded { --hue: var(--grey) !important; --hue-wash: #ECEDF2 !important; box-shadow: none; }
  .card.superseded > *:not(.lineage) { opacity: 0.6; }
  .card.superseded h3 { text-decoration: line-through; }
  .card.proposed { border: 1.5px dashed var(--purple); border-left: 5px solid var(--hue); background: var(--purple-wash); box-shadow: none; }
  .card.proposed .pill { background: var(--amber-wash); color: var(--ink); padding: 1px 9px; border-radius: 6px; border: 1px solid var(--amber); }

  /* Proposal */
  .proposal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; max-width: 840px; box-shadow: var(--shadow); }
  .diff { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
  .diff-row { display: grid; grid-template-columns: 3.2em 1fr; gap: 8px; font-family: var(--mono); font-size: 0.85rem; padding: 3px 0; }
  .diff-row .lbl { font-family: var(--sans); font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); padding-top: 2px; }
  .diff-old { color: var(--ink-soft); text-decoration: line-through; }
  .diff-new { color: var(--ink); font-weight: 700; background: var(--purple-wash); border-radius: 4px; padding: 1px 5px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .diff-note { margin: 9px 0 0; font-size: 0.95rem; color: var(--ink); }
  .proposal-actions { display: flex; gap: 10px; }
  .proposal-actions .btn:not(.btn-accent) { background: transparent; border-color: var(--ink); color: var(--ink); }
  .proposal-actions .btn:not(.btn-accent):hover { background: var(--bg); }

  /* Draft panel */
  .panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .panel h3 { margin: 0 0 4px; font-family: var(--serif); font-size: 1.12rem; }
  .panel .hint { margin: 0 0 12px; font-size: 0.85rem; color: var(--ink-soft); }
  .draft { font-family: var(--mono); font-size: 0.95rem; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 14px; min-height: 4.5em; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
  .draft:focus { border-color: var(--purple); }
  .note { margin: 10px 0 0; font-size: 0.85rem; color: var(--ink-soft); }

  /* Alerts */
  .alert { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--coral); border-radius: 12px; padding: 13px 16px; box-shadow: var(--shadow); }
  .alert .ids { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; color: var(--coral-text); }
  .alert p { margin: 4px 0 8px; }

  /* Toast */
  .toasts { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; pointer-events: none; }
  .toast { background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 20px rgba(27, 31, 59, 0.3); }

  /* Highlight pulse */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.65); }
    35% { box-shadow: 0 0 0 9px rgba(108, 92, 231, 0.3); }
    100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0); }
  }
  .pulse { animation: pulse 1.5s ease-out 1; }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; outline: 3px solid var(--purple); outline-offset: 2px; }
    .bob, .pop, .avatar.walking .av-body { animation: none; }
    .world.fly { transition: none; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wordmark">Pr<span>VSM</span></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-action="view" data-view="home">Office <kbd>0</kbd></button>
    <button class="tab" role="tab" data-action="view" data-view="backend">Team Backend <kbd>1</kbd></button>
    <button class="tab" role="tab" data-action="view" data-view="frontend">Team Frontend <span class="badge" id="fe-badge" hidden></span> <kbd>2</kbd></button>
    <button class="tab" role="tab" data-action="view" data-view="global">Global <kbd>3</kbd></button>
  </nav>
  <div class="actions">
    <button class="btn btn-accent" data-action="sync">Sync</button>
    <button class="btn btn-ghost" data-action="reset">Reset</button>
  </div>
</header>
<main id="app" class="viewport">
  <div class="world" id="world"></div>
  <div class="hud-top"><div class="hq-strip">
    <button class="btn" id="hud-back" data-action="view" data-view="home" hidden>← Back to office <kbd>0</kbd></button>
    <div class="hq-title">PrVSM Headquarters</div>
    <div class="roster">
      <button class="presence" data-action="view" data-view="backend"><i></i>Priya <small>· Backend</small></button>
      <button class="presence" data-action="view" data-view="frontend"><i></i>Sam <small>· Frontend</small></button>
      <button class="presence" data-action="view" data-view="global"><i></i>Translator</button>
    </div>
  </div></div>
  <p class="scene-hint" id="hint">Click a cubicle or the whiteboard to fly in · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> · scroll to zoom, drag to pan, <kbd>0</kbd> to come back</p>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* ===================== Pure state logic (no DOM) ===================== */
var SEED_TEXT = 'GET /orders returns { id, items[], total_cents, status }.';
var CURRENCY_TEXT = 'GET /orders returns { id, items[], total_cents, currency, status }.';
var CURRENCY_DIFF = 'Adds a currency field to every order; total_cents unchanged. Frontend must read currency instead of assuming USD.';
var SRC_DEC_BE_002 = { label: 'Team Backend board · DEC-BE-002', view: 'backend', el: 'card-DEC-BE-002' };

function artifact(id, type, team, affects, updated, state, source, title, text) {
  return { id: id, type: type, team: team, affects: affects, updated: updated, state: state,
    source: source, body: { title: title, text: text } };
}

function seedState() {
  return {
    view: 'backend',
    draft: SEED_TEXT,
    imported: false,
    whiteboard: [
      artifact('INT-BE-001', 'interface', 'backend', ['frontend'], '2026-09-18T10:05:00Z', 'accepted', SRC_DEC_BE_002,
        'Orders API response shape', SEED_TEXT),
      artifact('DEC-BE-001', 'decision', 'backend', ['frontend', 'data'], '2026-09-18T10:05:00Z', 'accepted', SRC_DEC_BE_002,
        'Money is integer cents everywhere', 'No floats cross a service boundary; display formatting is a client concern.')
    ],
    boards: {
      backend: [
        artifact('DEC-BE-002', 'decision', 'backend', [], '2026-09-18T09:40:00Z', 'accepted', { label: "chat: Priya's Claude chat, Sep 18" },
          'Orders service owns pricing math', 'All money math happens server-side; clients receive integer cents only.'),
        artifact('STA-BE-001', 'status', 'backend', [], '2026-09-18T16:20:00Z', 'accepted', SRC_DEC_BE_002,
          'Orders API v1 deployed to staging', 'GET /orders live on staging; auth middleware still pending.')
      ],
      frontend: [
        artifact('STA-FE-001', 'status', 'frontend', [], '2026-09-17T15:10:00Z', 'accepted', { label: "chat: Sam's Claude chat, Sep 17" },
          'Orders table UI scaffolded', 'Table renders against mocked data; wiring to the live API is next.')
      ]
    },
    proposals: [],
    alerts: []
  };
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function norm(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }
function findById(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

/* Current accepted head of the Orders API interface lineage (INT-BE-001 → …). */
function headInterface(state) {
  var a = findById(state.whiteboard, 'INT-BE-001');
  while (a && a.supersededBy && findById(state.whiteboard, a.supersededBy)) a = findById(state.whiteboard, a.supersededBy);
  return a;
}

function setView(state, view) { var s = clone(state); s.view = view; return { state: s, fresh: [] }; }
function setDraft(state, text) { var s = clone(state); s.draft = text; return { state: s, fresh: [] }; }

function sync(state, now) {
  var s = clone(state);
  s.view = 'global';
  var head = headInterface(s);
  var draft = norm(s.draft);
  var pending = s.proposals.some(function (p) { return p.supersedes === head.id; });
  if (!draft || draft === norm(head.body.text) || pending) {
    return { state: s, toast: 'Nothing new to translate.', fresh: [] };
  }
  var n = parseInt(head.id.slice(-3), 10) + 1;
  var id = 'INT-BE-' + ('00' + n).slice(-3);
  var p = artifact(id, 'interface', 'backend', ['frontend'], now, 'proposed',
    { label: 'Team Backend board · Orders API draft', view: 'backend', el: 'draft-panel' },
    'Orders API response shape (v' + n + ')', draft);
  p.supersedes = head.id;
  p.diff = (draft === CURRENCY_TEXT && norm(head.body.text) === SEED_TEXT)
    ? CURRENCY_DIFF
    : "Response shape changed from '" + norm(head.body.text) + "' to '" + draft + "'.";
  s.proposals.push(p);
  return { state: s, toast: 'Proposed ' + id + ' — review it in the tray.', fresh: ['card-' + id] };
}

function accept(state, id, now) {
  var s = clone(state);
  var p = findById(s.proposals, id);
  if (!p) return { state: s, fresh: [] };
  s.proposals = s.proposals.filter(function (x) { return x.id !== id; });
  p.state = 'accepted';
  p.updated = now;
  var old = findById(s.whiteboard, p.supersedes);
  var at = s.whiteboard.length;
  if (old) {
    old.state = 'superseded';
    old.supersededBy = p.id;
    at = s.whiteboard.indexOf(old) + 1;
  }
  s.whiteboard.splice(at, 0, p);
  var canned = p.diff === CURRENCY_DIFF;
  s.alerts.push({
    id: 'ALR-' + (s.alerts.length + 1), team: 'frontend', from: p.supersedes, to: p.id, created: now,
    text: canned
      ? 'Orders API adds a currency field; total_cents unchanged. Your orders table reads this shape — review whether it must handle currency.'
      : 'Orders API response shape changed. Your orders table reads this shape — review whether it must change.',
    link: { view: 'global', el: 'card-' + p.id }
  });
  return { state: s, toast: 'Accepted — Team Frontend alerted.', fresh: ['card-' + p.id] };
}

function dismiss(state, id) {
  var s = clone(state);
  s.proposals = s.proposals.filter(function (x) { return x.id !== id; });
  return { state: s, toast: 'Proposal dismissed.', fresh: [] };
}

function importChat(state) {
  var s = clone(state);
  if (s.imported) return { state: s, toast: 'Already imported.', fresh: [] };
  var src = { label: "chat: Sam's Claude chat, Sep 19" };
  var t = '2026-09-19T09:00:00Z';
  var items = [
    artifact('DEC-FE-001', 'decision', 'frontend', [], t, 'accepted', src,
      'State management: Zustand + react-query', 'Zustand for UI state, react-query for server state. Locked in.'),
    artifact('INT-FE-001', 'interface', 'frontend', ['backend'], t, 'accepted', src,
      'Orders table coupled to GET /orders shape', 'The table renders { id, items[], total_cents, status } exactly; a shape change breaks frontend.'),
    artifact('BLK-FE-001', 'blocker', 'frontend', ['payments'], t, 'accepted', src,
      'Checkout blocked on payments sandbox key', 'No sandbox credentials since Tuesday; checkout flow cannot start.'),
    artifact('QST-FE-001', 'question', 'frontend', ['payments'], t, 'accepted', src,
      'Mock payments or wait?', 'Undecided whether to mock the sandbox or wait; needs payments team input.')
  ];
  s.boards.frontend = s.boards.frontend.concat(items);
  s.imported = true;
  return { state: s, toast: 'Imported 4 artifacts.', fresh: items.map(function (a) { return 'card-' + a.id; }) };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { seedState: seedState, sync: sync, accept: accept, dismiss: dismiss, importChat: importChat,

      (state.proposals.length ? state.proposals.map(proposalHTML).join('') : '<div class="empty">No proposals. Sync to check for changes.</div>') +
      '</div></div></section></div>';
    return frameHTML('backend', backend) + frameHTML('frontend', frontend) + frameHTML('global', global);
  }

  /* Tabs, badge, HUD, which board is "in focus" — no world rebuild needed */
  function syncChrome() {
    var v = state.view;
    if (v === 'frontend') {                       /* looking at the alerts clears Sam's bubble */
      seenAlerts = state.alerts.length;
      var bub = document.getElementById('sam-bubble');
      if (bub && bub.parentNode) bub.parentNode.removeChild(bub);
    }
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-selected', String(tabs[i].getAttribute('data-view') === v));
    var badge = document.getElementById('fe-badge');
    badge.hidden = state.alerts.length === 0;
    badge.textContent = state.alerts.length;
    badge.setAttribute('aria-label', state.alerts.length + ' alerts');
    world.setAttribute('data-view', v);
    document.getElementById('hud-back').hidden = v === 'home';
    document.getElementById('hint').hidden = v !== 'home';
    var frames = document.querySelectorAll('.frame');
    for (var j = 0; j < frames.length; j++) frames[j].classList.toggle('focus', frames[j].getAttribute('data-frame') === v);
  }

  function render() {
    if (state.view === 'frontend') seenAlerts = state.alerts.length;
    world.innerHTML = sceneSVG() + boardsHTML();
    document.getElementById('draft').textContent = state.draft;
    syncChrome();
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    toasts.innerHTML = '';
    toasts.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
  }

  function pulse(ids) {
    (ids || []).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      setTimeout(function () { el.classList.remove('pulse'); }, 1700);
    });
  }

  /* ---------- Camera ---------- */
  var cam = { x: 0, y: 0, s: 1 };

  function shotFor(view) {
    if (view === 'home') return HOME_SHOT;
    var f = FRAMES[view], k = f.w / FRAME_W, el = document.getElementById('frame-' + view);
    var h = el.offsetHeight * k;
    return { x: f.ax - f.w / 2, y: f.anchor === 'bottom' ? f.ay - h : f.ay, w: f.w, h: h, maxS: 1.15 / k, k: k };
  }
  function fit(r) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight, room = vh - HUD_TOP - 12;
    var s = Math.min(vw * 0.95 / r.w, room * 0.97 / r.h, r.maxS);
    if (r.k) s = Math.max(s, Math.min(vw * 0.95 / r.w, 0.85 / r.k));   /* boards never land smaller than readable; drag to see the rest */
    var slack = room - r.h * s;
    return { s: s, x: (vw - r.w * s) / 2 - r.x * s, y: HUD_TOP + (slack < 0 ? 6 : slack * (r.k ? 0.3 : 0.5)) - r.y * s };
  }
  function setCam(c, animate) {
    world.classList.toggle('fly', !!animate && !reducedMotion());
    void world.offsetWidth;
    cam = c;
    world.style.transform = 'translate(' + c.x.toFixed(2) + 'px,' + c.y.toFixed(2) + 'px) scale(' + c.s.toFixed(4) + ')';
  }
  function camMoves(c) { return Math.abs(c.s / cam.s - 1) > 0.01 || Math.abs(c.x - cam.x) > 4 || Math.abs(c.y - cam.y) > 4; }
  function flyTo(view, animate) { setCam(fit(shotFor(view)), animate); }

  /* Free roaming: keep the viewport centre inside the office, and work out which board (if any) is in focus */
  function roam(c) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    c.x = Math.max(vw / 2 - VB.w * c.s, Math.min(vw / 2, c.x));
    c.y = Math.max(vh / 2 - VB.h * c.s, Math.min(vh / 2, c.y));
    setCam(c, false);
    var cx = (vw / 2 - c.x) / c.s, cy = (vh / 2 - c.y) / c.s, found = 'home';
    ['backend', 'frontend', 'global'].forEach(function (v) {
      var r = shotFor(v);
      if (c.s * r.k >= 0.5 && cx > r.x - 8 && cx < r.x + r.w + 8 && cy > r.y - 8 && cy < r.y + r.h + 8) found = v;
    });
    if (found !== state.view) { state = setView(state, found).state; syncChrome(); }
  }

  function apply(result) {
    var prev = state.view;
    state = result.state;
    render();
    var target = fit(shotFor(state.view)), flying = camMoves(target) && !reducedMotion();
    setCam(target, true);
    if (result.toast) toast(result.toast);
    if (flying && state.view !== prev) setTimeout(function () { pulse(result.fresh); }, 920);
    else pulse(result.fresh);
  }

  function go(view) {
    if (busy) return;
    if (view === state.view) flyTo(view, true);      /* re-centre after roaming */
    else apply(setView(state, view));
  }

  /* ---------- Moment: Sync — the Translator carries a paper to the tray ---------- */
  function runSync() {
    var result = sync(state, new Date().toISOString());
    if (!result.fresh.length || reducedMotion()) { apply(result); return; }
    busy = true;
    var wasHome = state.view === 'home';
    if (!wasHome) { state = setView(state, 'home').state; render(); }
    var shot = fit(wasHome ? HOME_SHOT : WALK_SHOT), wait = camMoves(shot) ? 950 : 30;
    setCam(shot, true);
    setTimeout(function () {
      var tr = document.getElementById('av-translator');
      void tr.getBoundingClientRect();
      tr.classList.add('walking');
      tr.style.transition = 'transform 0.5s ease-in-out';
      tr.style.transform = translate(POS.translatorBackend);
      setTimeout(function () {
        tr.classList.add('carrying');
        tr.style.transition = 'transform 1.4s ease-in-out';
        tr.style.transform = translate(POS.translatorIdle);
        setTimeout(function () {
          state = setView(result.state, 'home').state;
          popTray = true; render(); popTray = false;
          setTimeout(function () { busy = false; apply(result); }, 700);
        }, 1450);
      }, 550);
    }, wait);
  }

  /* ---------- Input ---------- */
  document.addEventListener('click', function (e) {
    if (busy || suppressClick || !e.target.closest) return;
    var frame = e.target.closest('.frame');
    if (frame && frame.getAttribute('data-frame') !== state.view) { go(frame.getAttribute('data-frame')); return; }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var now = new Date().toISOString();
    if (action === 'view') go(el.getAttribute('data-view'));
    else if (action === 'sync') runSync();
    else if (action === 'reset') { seenAlerts = 0; apply({ state: setView(seedState(), 'home').state, toast: 'Reset to seed state.', fresh: [] }); }
    else if (action === 'add-currency') { var r = setDraft(state, CURRENCY_TEXT); r.fresh = ['draft']; apply(r); }
    else if (action === 'accept') { var ra = accept(state, el.getAttribute('data-id'), now); ra.fresh = ra.fresh.concat(['wb-frame']); apply(ra); }
    else if (action === 'dismiss') apply(dismiss(state, el.getAttribute('data-id')));
    else if (action === 'import') apply(importChat(state));
    else if (action === 'goto') {
      var r2 = setView(state, el.getAttribute('data-view'));
      r2.fresh = [el.getAttribute('data-el')];
      apply(r2);
    }
  });

  /* Manual draft edits: update state without re-rendering (keeps the caret). */
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'draft') state = setDraft(state, e.target.textContent).state;
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.id === 'draft') { if (e.key === 'Enter') { e.preventDefault(); t.blur(); } return; }
    if (busy || e.ctrlKey || e.metaKey || e.altKey || (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))) return;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('zone')) {
      e.preventDefault(); go(t.getAttribute('data-view')); return;
    }
    var views = { '0': 'home', '1': 'backend', '2': 'frontend', '3': 'global' };
    if (views[e.key]) go(views[e.key]);
  });

  /* Scroll = zoom around the cursor */
  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (busy) return;
    var box = viewport.getBoundingClientRect(), mx = e.clientX - box.left, my = e.clientY - box.top;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    var s = Math.max(fit(HOME_SHOT).s * 0.7, Math.min(13, cam.s * Math.exp(-dy * 0.0016))), f = s / cam.s;
    roam({ s: s, x: mx - (mx - cam.x) * f, y: my - (my - cam.y) * f });
  }, { passive: false });

  /* Drag = pan (a click without movement still counts as a click) */
  var drag = null;
  viewport.addEventListener('pointerdown', function (e) {
    if (busy || e.button !== 0 || !e.target.closest) return;
    if (e.target.closest('.hud-top, .frame.focus button, .frame.focus [contenteditable]')) return;
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 7) return;
      drag.moved = true;
      viewport.classList.add('dragging');
      try { viewport.setPointerCapture(drag.id); } catch (err) {}
    }
    roam({ s: cam.s, x: drag.cx + dx, y: drag.cy + dy });
  });
  function endDrag() {
    if (drag && drag.moved) { suppressClick = true; setTimeout(function () { suppressClick = false; }, 60); }
    drag = null;
    viewport.classList.remove('dragging');
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', function () { if (!busy) flyTo(state.view, false); });

  render();
  flyTo('home', false);
})();
</script>
</body>
</html>
